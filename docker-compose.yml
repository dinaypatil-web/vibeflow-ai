version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibeflow
      POSTGRES_PASSWORD: vibeflow_secret
      POSTGRES_DB: vibeflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeflow -d vibeflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeflow-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://vibeflow:vibeflow_secret@postgres:5432/vibeflow_db
      JWT_SECRET: vibeflow-super-secret-key-2026
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vibeflow-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
